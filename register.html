
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .form-container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            padding: 10px;
        }

        .form-container iframe {
            width: 100%;
            height: 100vh;
            min-height: 700px;
            border: none;
            display: block;
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 0;
            }

            .form-container iframe {
                height: 100vh;
                min-height: 850px;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">
        <iframe
            src="https://docs.google.com/forms/d/e/1FAIpQLSc82DtJw7PGnpq7jNHWNaBQs2hD49PsQ8BgAOCa1m_67Omkqg/viewform?embedded=true"
            loading="lazy"
            title="Google Form">
        </iframe>
    </div>

</body>
</html>
